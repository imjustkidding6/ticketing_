[PHP]
memory_limit = 256M
max_execution_time = 30
max_input_time = 30
post_max_size = 64M
upload_max_filesize = 64M
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

[session]
session.gc_maxlifetime = 7200

[session_upload_progress]
; See docker/php/php.ini — defence in depth for PHP2Shell (CVE-2026-109618 /
; CVE-2026-109619). The patched 8.4 runtime is the fix; this removes the
; default-on feature the interim mitigation named. Nothing in this app uses
; upload-progress polling.
session.upload_progress.enabled = 0
